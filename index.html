<!doctype html>
<html lang="zh">

<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#e6d8b8; --ink:#2b2420; --silk:#5b3a26; --seal:#b3261e; }

    background:#ece5d8; color:#3b4255; font:inherit; font-weight:700; }

    75% { opacity:1 } 100% { opacity:0; transform:translate(-50%, -30px) } }
  /* 锦衣坊：借鉴原神的角色/背包界面语言——深色半透明底 + 金边、3/4/5 星蓝紫金卡牌、左侧可转的立绘 */
  .shop { position:fixed; inset:0; z-index:10; display:flex; color:#ece5d8; font-family:'Noto Serif SC', serif;

  #pv { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }

  .cn { flex:none; width:16px; height:16px; border-radius:50%; position:relative;

  .cn::after { content:''; position:absolute; inset:5px; background:#3b2a12; border-radius:1px; }
  .x { flex:none; width:36px; height:36px; border-radius:50%; border:1px solid rgba(211,188,142,.5);
    background:rgba(255,255,255,.08); color:#ece5d8; font-size:16px; cursor:pointer; }

    gap:14px; align-content:start; padding:6px; }
  .card { position:relative; padding:0; border:0; border-radius:8px; overflow:hidden; cursor:pointer; font:inherit;

  .card:hover { transform:translateY(-3px); }

  .r3 .art { background:linear-gradient(160deg, #4e6c93, #5f8fc9); }
  .r4 .art { background:linear-gradient(160deg, #6c5a9c, #a986d4); }
  .r5 .art { background:linear-gradient(160deg, #94603a, #d8a24f); }

  .detail .ds { color:#ffcc32; font-size:14px; } .detail p { margin:4px 0 0; font-size:13px; opacity:.8; }
  .detail .dr { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .price { display:flex; align-items:center; gap:6px; white-space:nowrap; }

  .gbtn:disabled { opacity:.5; cursor:default; }

  .msg { min-height:1.3em; font-size:13px; color:#9fe0c4; } .msg.err { color:#ff9c8a; }
  .shake { animation:shake .35s; }
  /* 战斗：宝可梦式排版——左上敌方牌、右下己方牌、底部对话框 + 2×2 招式 */
  body.fighting > :not(#c):not(#battle):not(.toast):not(#loading):not(script) { visibility:hidden; }
  .battle { position:fixed; inset:0; z-index:8; font-family:'Noto Serif SC', serif; color:#2b2420; pointer-events:none; overflow:hidden; }
  .battle[hidden] { display:none; }
  .bt-box { position:absolute; width:min(330px, 44vw); padding:10px 16px 12px; background:linear-gradient(#f9f1dc, #e8d9b2);
    border:3px solid #2b2420; border-radius:8px 28px 8px 28px; box-shadow:5px 6px 0 rgba(43,36,32,.35); transition:transform .55s cubic-bezier(.2,1.5,.4,1), opacity .4s; }
  .bt-foe { left:5vw; top:10vh; } .bt-me { right:5vw; bottom:190px; }
  .battle.intro .bt-foe { transform:translateX(-130%); opacity:0; } .battle.intro .bt-me { transform:translateX(130%); opacity:0; }

  .bt-bar.st i { height:6px; } .bt-bar.st b { background:#e9c46a; }
  .bt-num { margin-top:2px; text-align:right; font-size:14px; font-weight:bold; }
  .bt-fx { min-height:16px; margin-top:3px; font-size:12px; color:#b3261e; }

  .battle.intro .bt-panel { transform:translateY(100%); }

  .bt-moves { flex:0 0 min(470px, 54%); display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  .bt-mv:hover:not(:disabled) { transform:translateY(-2px); border-color:#d4a73a; }
  .bt-mv:disabled { opacity:.42; cursor:default; }
  .bt-mv b { flex:none; display:grid; place-items:center; width:36px; height:36px; border-radius:8px; font-family:'Ma Shan Zheng', serif; font-size:24px; font-weight:normal; color:#fff; }
  .bt-mv div { min-width:0; font-size:16px; font-weight:bold; } .bt-mv small { display:block; font-size:11px; font-weight:normal; color:#5a4a3a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bt-run.bt-bag { right:auto; left:calc(100% - min(470px, 54%) - 16px); }
  .bt-moves { overflow:auto; align-content:start; }

  .bt-mv.fist b { background:#b3261e; } .bt-mv.kick b { background:#c98f35; } .bt-mv.qi b { background:#3f9b7c; } .bt-mv.arm b { background:#44506a; }
  .bt-run { position:absolute; right:16px; top:-40px; padding:5px 16px; font:inherit; font-size:13px; color:#f3e3bd; cursor:pointer;

    30% { transform:translate(-50%, -40px) scale(1) } 100% { transform:translate(-50%, -100px); opacity:0 } }

const WALLS = [0xdac9a2, 0xcfb98e, 0xe3d6b6, 0xc7b391];
const ROOFS = [0x4d4b48, 0x5b5853, 0x44423e, 0x57534b];
const THATCH = 0xa68d5a, WOOD = 0x6e4a2c, DARK = 0x2e241c;

// 屋顶：凹曲面坡顶，屋脊沿 x 方向，底面在 y=0
function roof(len, depth, rh, color, curved = true) {
  const D = depth / 2, s = new THREE.Shape(), k = curved ? 0.35 : 0.5;
  s.moveTo(-D, 0);
  s.quadraticCurveTo(-D * k, rh * k, 0, rh);
  s.quadraticCurveTo(D * k, rh * k, D, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: len, bevelEnabled: false, curveSegments: 6 });
  g.translate(0, 0, -len / 2);
  g.rotateY(Math.PI / 2);
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(g, mat(color)));
  if (curved) {
    const ridge = box(len + 0.5, 0.32, 0.42, 0x2f2d2a); ridge.position.y = rh + 0.08; grp.add(ridge);
    for (const sx of [-1, 1]) {
      const e = box(0.45, 0.55, 0.3, 0x2f2d2a);
      e.position.set(sx * (len / 2 + 0.3), rh + 0.3, 0); e.rotation.z = -sx * 0.55; grp.add(e);
    }
  }
  return grp;
}

const houses = [];   // 主角撞墙、找门用：{ x, z, hw, hd, face, kind: home|shop|inn|tailor, type, name }
function house(x, z, face, o = {}) {

  const g = new THREE.Group();
  const wallC = pick(WALLS), roofC = o.thatch ? THATCH : pick(ROOFS);
  const wall = box(w, h, d, wallC); wall.position.y = h / 2; g.add(wall);
  // 立柱
  for (const sx of [-1, 1]) {
    const post = box(0.22, h, 0.22, WOOD); post.position.set(sx * (w / 2 - 0.05), h / 2, d / 2 + 0.02); g.add(post);
  }
  let top = h;
  if (o.storey2) {
    const eave = box(w + 1.4, 0.22, d + 1.4, roofC); eave.position.y = h + 0.1; g.add(eave);
    const bal = box(w + 0.2, 0.6, 0.12, 0x8a3d2a); bal.position.set(0, h + 0.55, d / 2 + 0.1); g.add(bal);

    const alongX = p.path !== 'cross' && p.path !== 'bridge', dir = Math.sign(p.v), right = alongX ? dir : -dir;
    let lat = 0;
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const q of grid.get(cellKey(i0 + i, j0 + j)) ?? []) {
      if (q === p) continue;
      const dx = x - q.g.position.x, dz = z - q.g.position.z, d = Math.hypot(dx, dz);
      if (d >= AR || d < 1e-4) continue;
      const w = (AR - d) / AR, ahead = -(alongX ? dx : dz) * dir;
      lat += (alongX ? dz : dx) / d * w;
      if (ahead > 0.2) { lat += right * w * 0.6; p.slow = Math.min(p.slow, 0.1 + 0.9 * d / AR); }
    }
    p.o = clamp(p.o + lat * 5 * dt, -p.r, p.r);
  }
}

// 离镜头远的人既不播动画也不画——四五百个蒙皮角色，只算看得见的那一两百个
function updatePeople(dt) {
  const cx = controls.target.x;
  if (avoid) avoidPeople(dt);
  for (const p of people) {
    const sdt = avoid && !p.fixed ? dt * p.slow : dt;   // 被挤住时步子和腿一起慢下来
    let pos = p.fixed;
    if (!pos) {
      const P = PATHS[p.path];
      p.s += p.v * sdt;
      if (p.s > P.b || p.s < P.a) { p.v = -p.v; p.s = clamp(p.s, P.a, P.b); }
      pos = P.f(p.s, p.o);
      roam(p, pos);
    }
    p.g.visible = Math.abs((p.boat ? p.boat.position.x : pos.x) - cx) < 130;
    if (!p.g.visible) continue;
    if (!p.fixed) {
      const dx = pos.x - p.g.position.x, dz = pos.z - p.g.position.z;
      if (dx || dz) p.g.rotation.y = Math.atan2(dx, dz);
      p.g.position.copy(pos);
    }
    p.mixer.update(sdt);
  }
}

// 客栈：一楼大厅 + 柜台店小二，右侧楼梯上二楼；二楼回廊沿三面墙，每面两扇客房门
const IW = 7, ID = 5.5, FH = 3.4, MEZ = 1.6, STAIR_Z0 = 5.3, STAIR_Z1 = 1.3;

// 浴堂：青砖地、大浴桶冒热气，四只凳子可坐着歇脚

  for (const y of [0.2, 0.7]) { const hp = new THREE.Mesh(new THREE.CylinderGeometry(1.17, 1.11, 0.07, 28, 1, true), imat(0x2e2218, { side: THREE.DoubleSide })); hp.position.set(0, y, TZ); roomGroup.add(hp); }
  icyl(1.09, 1.09, 0.01, 0x8fc4d4, 0, 0.74, TZ, 28, { transparent: true, opacity: 0.55, depthWrite: false, emissive: 0x1a3a44 });

function roomWalkable(x, z) {
  if (Math.abs(x) > ROOM_W - 0.35 || z < -ROOM_D + 0.35 || z > ROOM_D - 0.3) return false;
  if (room.kind === 'inn') {
    const y = innHeight(x, z, heroLevel);
    if (y === null || Math.abs(y - hero.g.position.y) > 0.6) return false;   // 台阶一步最多迈 0.6
    if (y > 0.3) return true;   // 楼梯、楼上不受一楼家具阻挡
  }
  return !roomObstacles.some(([cx, cz, hw, hd]) => Math.abs(x - cx) < hw + 0.3 && Math.abs(z - cz) < hd + 0.3);
}
function roomHeight(x, z) {
  if (room.kind !== 'inn') return 0;
  const y = innHeight(x, z, heroLevel) ?? hero.g.position.y;
  if (onStair(x, z)) heroLevel = y > FH / 2 ? 1 : 0;
  return y;
}

const hudEl = document.getElementById('hud'), hudMoney = document.getElementById('hudMoney'), hudPlace = document.getElementById('hudPlace');
const promptEl = document.getElementById('prompt');
function updateHud() { hudMoney.textContent = wallet.money.toLocaleString() + ' 文'; hudEl.hidden = view === 'scroll' || shopOpen; if (!room) hudPlace.textContent = ''; }
function toast(big, small) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `${big}<small>${small}</small>`; document.body.appendChild(t); setTimeout(() => t.remove(), 2300);
}
function buildRoom(r) {
  roomGroup.traverse(o => { if (o.geometry && !o.userData.shared) o.geometry.dispose(); });
  roomGroup.clear(); roomObstacles.length = 0; roomBeds = []; roomActors = []; chestMeshes = []; roomDoors = []; roomTalk = null; roomSeats = []; roomBath = null;
  const h = houses[r.idx];
  if (r.kind === 'home') buildHome(`home:${r.idx}`, 4.5, 3.5, false);
  if (r.kind === 'shop') buildShop(r.idx);
  if (r.kind === 'inn') buildInn(r.idx);
  if (r.kind === 'innroom') buildHome(`inn:${r.idx}:${r.door}`, 3.2, 2.5, true);
  if (r.kind === 'bath') buildBath(r.idx);
  hudPlace.textContent = r.kind === 'innroom' ? `${h.name} · ${DOOR_NAMES[r.door]}字房` : r.kind === 'bath' ? `${h.name} · 香水行` : h.name;
}
function enterRoom(r) {
  if (room) roomStack.push({ ...room, pos: hero.g.position.clone(), level: heroLevel, yaw: hero.g.rotation.y });
  else { outdoorPos.copy(hero.g.position); outdoorFace = houses[r.idx].face; scene.remove(hero.g); roomScene.add(hero.g); }
  room = r; heroLevel = 0; buildRoom(r);
  sfx('door_open', 0.6);
  hero.g.position.set(0, 0, ROOM_D - 0.9); hero.g.rotation.y = Math.PI;
  placeCamera(Math.PI); updateHud();
}
function exitRoom() {
  if (seated) standUp();
  sfx('door_close', 0.55);
  const back = roomStack.pop();
  if (back) {   // 客房出来回到客栈回廊
    room = back; buildRoom(back);
    hero.g.position.copy(back.pos); heroLevel = back.level; hero.g.rotation.y = back.yaw + Math.PI;
  } else {
    roomScene.remove(hero.g); scene.add(hero.g);
    room = null; heroLevel = 0;
    hero.g.position.copy(outdoorPos); hero.g.rotation.y = outdoorFace > 0 ? 0 : Math.PI;
  }
  placeCamera(hero.g.rotation.y); updateHud();
}
// 进出门后重新摆镜头：第三人称放在主角背后高处，第一人称平视朝前
function placeCamera(yaw) {
  const g = hero.g, fx = Math.sin(yaw), fz = Math.cos(yaw);
  controls.target.copy(g.position).y += 1.4;
  if (view === 'third') camera.position.set(g.position.x - fx * 6, g.position.y + 7, g.position.z - fz * 6);
  else { camera.position.copy(g.position).y += 1.35; camera.lookAt(camera.position.x + fx, camera.position.y, camera.position.z + fz); }
  controls.update();
}
function openChest(c) {
  c.state.opened = true;
  const st = roomState.get(roomKey);
  if (st.chests.every(x => x.opened)) st.refillAt = Date.now() + 180000;
  const t0 = performance.now(), anim = () => { const k = Math.min(1, (performance.now() - t0) / 450); c.lid.rotation.x = -1.9 * k * (2 - k); if (k < 1) requestAnimationFrame(anim); };
  anim();
  sfx('chest_creak', 0.7);
  ownerRoll(OWNER_P, 1100, '「好大胆的贼，敢翻我的箱子！」');
  const r = Math.random(), luck = buffVal('luck');
  if (r < 0.18 / luck) { toast('空空如也', '只有几只蛀虫爬了出来'); return; }
  setTimeout(() => sfx('coins', 0.7), 250);
  const wen = Math.round((r > 0.93 ? 1000 : 100 + Math.random() * 400) * luck / 10) * 10;   // 大多 100–500 文，偶尔一整两；财运加倍
  wallet.money += wen; save(); updateHud();
  if (wen >= 1000) setTimeout(() => sfx('bell', 0.35), 450);
  toast((wen >= 1000 ? '一锭纹银！' : '获得碎银') + (luck > 1 ? '（财运加持）' : ''), `${(wen / 1000).toFixed(wen >= 1000 ? 0 : 2)} 两 · +${wen} 文`);
}
// 每帧找身边可交互的东西：E 进出门、开宝箱；F 和掌柜/店家说话
let interactable = null, talkable = null;
function updateInteract() {
  interactable = talkable = null;
  if (view !== 'scroll' && !shopOpen && !sleeping) {
    const { x, z } = hero.g.position;
    if (room) {
      for (const c of chestMeshes) if (!c.state.opened && Math.hypot(x - c.g.position.x, z - c.g.position.z) < 1.5) interactable = { text: '打开宝箱', act: () => openChest(c) };
      if (room.kind === 'inn') for (const d of roomDoors) if (d.bath && heroLevel === 0 && Math.hypot(x - d.x, z - d.z) < 1.1) interactable = wallet.bag['inn:2']
        ? { text: `交一枚浴筹进香水行（剩 ${wallet.bag['inn:2']} 枚）`, act: () => { if (!--wallet.bag['inn:2']) delete wallet.bag['inn:2']; save(); enterRoom({ kind: 'bath', idx: room.idx }); } }
        : { text: '香水行 · 先到柜台买「热水沐浴」浴筹', act: () => { sfx('error', 0.5); toast('伙计拦住了你', '先到柜台找店家买一枚浴筹（热水沐浴，20 文）'); } };
      if (room.kind === 'inn' && heroLevel === 1) for (const d of roomDoors) if (!d.bath && Math.hypot(x - d.x, z - d.z) < 1.1) {
        const k = innKey(room.idx), nm = DOOR_NAMES[d.i] + '字房';
        interactable = k?.door === d.i ? { text: `开锁进入${nm}`, act: () => enterRoom({ kind: 'innroom', idx: room.idx, door: d.i }) }
          : { text: k ? `${nm} · 你的钥匙开的是${DOOR_NAMES[k.door]}字房` : `${nm} · 锁着，先到楼下柜台买钥匙`,
              act: () => { sfx('error', 0.5); toast('门锁着', k ? `你的钥匙开的是${DOOR_NAMES[k.door]}字房` : '楼下柜台找店家买钥匙'); } };
      }
      if (!interactable && heroLevel === 0 && z > ROOM_D - 1.4 && Math.abs(x) < 1.2) interactable = { text: room.kind === 'bath' ? '回到大厅' : roomStack.length ? '回到走廊' : '出门', act: exitRoom };
      if (roomTalk && heroLevel === 0 && Math.hypot(x - roomTalk.x, z - roomTalk.z) < 1.6) talkable = roomTalk;
      for (const b of roomBeds) if (!sleeping && Math.hypot(x - b.x, z - b.z) < 1.9) talkable = { text: '睡觉（体力气血回满）', act: () => sleepIn(b) };
      if (heroLevel === 0) for (const s of roomSeats) if (Math.hypot(x - s.x, z - s.z) < 0.9) talkable = { text: '坐下歇脚（回体力、气血）', act: () => sitOn(s) };
      if (roomBath && Math.hypot(x - roomBath.x, z - roomBath.z) < 1.9) talkable = { text: '沐浴（体力气血回满）', act: () => sleepIn({ ...roomBath, bath: true }) };
      if (seated) { interactable = null; talkable = { text: '起身', act: standUp }; }
    } else {
      let best = 2;
      houses.forEach((h, i) => {
        const d = Math.hypot(x - h.x, z - (h.z + h.face * h.hd));
        if (d < best) { best = d; interactable = h.kind === 'tailor' ? { text: '进入成衣铺 · 锦衣坊', act: openShop } : { text: '进入' + h.name, act: () => enterRoom({ kind: h.kind, idx: i }) }; }
      });
    }
  }
  promptEl.hidden = !interactable && !talkable;
  promptEl.innerHTML = [interactable && `<kbd>E</kbd>${interactable.text}`, talkable && `<kbd>F</kbd>${talkable.text}`].filter(Boolean).join('　　');
}
updateHud();

// ---------- 街上动兵器 ----------
// G 拿出/收起行囊里最好的兵器，J（第一人称锁鼠标时也可左键）出招：近身兵器打面前 2.4 米扇形，弹弓打 14 米直线。
// 打中行人：发白、喊一声、吓得快步跑开；打中小偷：直接开打，且先手伤害带进战斗
let held = null, swing = 0;   // held：{ id, mesh } 手里的兵器
const STREET_COST = 3;   // 每挥一下耗体力
function holdWeapon(w) {

  if (w) held = { id: w.id, mesh: attachWeapon(w) };
}

function heroSwing(name) {

  const a = hero.act[name];

}
const scared = new Set();
function scare(p) {   // 被打的行人加快脚步跑开几秒
  if (p.fixed) return;
  p.v0 ??= Math.abs(p.v);
  p.v = Math.sign(p.v) * Math.max(3.5, p.v0 * 3); p.scaredT = 3;
  scared.add(p);
}
function updateScared(dt) {
  for (const p of scared) {
    p.mixer.clipAction(clips.walk).timeScale = Math.abs(p.v) * 0.9;
    if ((p.scaredT -= dt) > 0) continue;
    p.v = Math.sign(p.v) * p.v0; p.mixer.clipAction(clips.walk).timeScale = p.v0 * 0.9; scared.delete(p);
  }
}
function streetAttack() {
  if (!held || swing > 0 || view === 'scroll' || shopOpen || sleeping || seated || battle) return;
  if (wallet.stamina < STREET_COST) { sfx('error', 0.4); return toast('没力气了', '歇一歇再动手'); }
  wallet.stamina -= STREET_COST;
  const sk = WEAPON_SKILLS[held.id], ranged = !!sk.ranged;
  heroSwing(ranged ? 'holding-right-shoot' : 'attack-melee-right'); whoosh(0.45);
  if (room) return;
  const g = hero.g, ry = g.rotation.y, fx = Math.sin(ry), fz = Math.cos(ry);
  let best = null, bd = Infinity;
  const test = (pos, obj) => {
    const dx = pos.x - g.position.x, dz = pos.z - g.position.z, d = Math.hypot(dx, dz), along = dx * fx + dz * fz, lat = Math.abs(dx * fz - dz * fx);
    if ((ranged ? along > 0 && along < 14 && lat < 0.9 : d < 2.4 && along > d * 0.5) && d < bd) { bd = d; best = obj; }
  };
  if (thief) test(thief.g.position, thief);
  for (const p of people) if (p !== hero && !p.boat && p.g.visible && p.g.parent === scene) test(p.g.position, p);
  const dmg = Math.round(sk.pow[0] + Math.random() * (sk.pow[1] - sk.pow[0])) * (sk.hits ?? 1);
  const land = () => {
    if (!best || battle) return;
    const at = best.g.position.clone().add(new THREE.Vector3(0, 1.1, 0));
    sfx(sk.sfx, 0.8); burst(at, ['slash', 'chop'].includes(sk.sfx) ? SLASH_TEX : STAR_TEX, 1.6, 260, scene); flashBody(best);
    if (best === thief) { const T = thief; thief = null; popNum(T, dmg, '', camera, document.body); setTimeout(() => startBattle(T, dmg), 350); return; }
    popNum(best, pick(['哎哟！', '救命啊！', '打人啦！', '你干什么！']), 'miss', camera, document.body);
    scare(best);
  };
  if (!ranged) return setTimeout(land, 180);
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), new THREE.MeshLambertMaterial({ color: 0x3a3a3a }));
  const from = g.position.clone().add(new THREE.Vector3(fx * 0.5, 1.2, fz * 0.5)), to = best ? best.g.position.clone().add(new THREE.Vector3(0, 1.1, 0)) : from.clone().add(new THREE.Vector3(fx * 14, -0.6, fz * 14));
  scene.add(m);
  tween(Math.max(120, from.distanceTo(to) * 25), k => m.position.lerpVectors(from, to, k)).then(() => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); land(); });
}

// 积雪 / 湿润：给所有 Lambert 材质注入同一段着色器，雪只落在朝上的面
const wxU = { uSnow: { value: 0 }, uWet: { value: 0 } };
function weatherPatch(sh) {

  sh.fragmentShader = 'uniform float uSnow, uWet;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `
    float wxUp = dot(normal, normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz));
    diffuseColor.rgb *= 1.0 - 0.22 * uWet;

    #include <emissivemap_fragment>`);
}

// 雨、雪取程度拉满时的氛围，实际按程度从晴天插值过去；虹的氛围与大小无关
const WEATHER = {
  clear:   { fog: PAPER,    near: 75, far: 240, hemi: 1.9,  sun: 1.9,  wet: 0 },
  rain:    { fog: 0x9e9c92, near: 12, far: 120, hemi: 0.95, sun: 0.05, wet: 1 },
  snow:    { fog: 0xf1efe9, near: 15, far: 130, hemi: 2.1,  sun: 0.45, wet: 0 },
  rainbow: { fog: 0xe8dcbf, near: 85, far: 260, hemi: 2.0,  sun: 2.1,  wet: 0.6 },
};
const WX_KEYS = ['clear', 'rain', 'snow', 'rainbow'];
const LV_NAME = { rain: '雨量', snow: '雪量', rainbow: '虹大小' };
const levels = { rain: 0.5, snow: 0.5, rainbow: 0.5 };   // 0.05–1

// 雨：线段，围绕视点的盒子内循环下落
const RAIN_N = 16000, RW = 160, RH = 70, RZ0 = -95, RZ1 = 55, STREAK = 0.045;
const rainLocal = new Float32Array(RAIN_N * 3), rainPos = new Float32Array(RAIN_N * 6);
const rnd = (a, b) => a + (b - a) * Math.random();
for (let i = 0; i < RAIN_N; i++) rainLocal.set([rnd(-RW / 2, RW / 2), rnd(0, RH), rnd(RZ0, RZ1)], i * 3);
const rainGeo = new THREE.BufferGeometry();
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3).setUsage(THREE.DynamicDrawUsage));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0x5d6770, transparent: true, opacity: 0.5, depthWrite: false }));
rain.frustumCulled = false;
function updateRain(dt, amt) {
  const n = Math.floor(RAIN_N * amt);
  rain.visible = n > 0; if (!n) return;
  const cx = controls.target.x, cz = controls.target.z, L = rainLocal, P = rainPos;
  const RAIN_V = 40 + 22 * levels.rain, WIND = 3 + 11 * levels.rain;   // 雨越大落得越急、越斜
  for (let i = 0; i < n; i++) {
    const j = i * 3, k = i * 6;
    let y = L[j + 1] - RAIN_V * dt;
    if (y < 0) { y += RH; L[j] = rnd(-RW / 2, RW / 2); L[j + 2] = rnd(RZ0, RZ1); }
    L[j + 1] = y;
    const x = cx + L[j] - WIND * y / RAIN_V, z = cz + L[j + 2];
    P[k] = x; P[k + 1] = y; P[k + 2] = z;
    P[k + 3] = x - WIND * STREAK; P[k + 4] = y + RAIN_V * STREAK; P[k + 5] = z;
  }
  rainGeo.setDrawRange(0, n * 2);
  rainGeo.attributes.position.needsUpdate = true;
}

// 雪：点精灵，缓落并左右飘摆
const SNOW_N = 14000, snowLocal = new Float32Array(SNOW_N * 4), snowPos = new Float32Array(SNOW_N * 3);
for (let i = 0; i < SNOW_N; i++) snowLocal.set([rnd(-RW / 2, RW / 2), rnd(0, RH), rnd(RZ0, RZ1), rnd(0, 6.28)], i * 4);
const flakeTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const x = cv.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.45, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(cv);
})();
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3).setUsage(THREE.DynamicDrawUsage));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: 0.6, map: flakeTex, transparent: true, depthWrite: false }));
snow.frustumCulled = false;
function updateSnow(dt, time, amt) {
  const n = Math.floor(SNOW_N * amt);
  snow.visible = n > 0; if (!n) return;
  const cx = controls.target.x, cz = controls.target.z, L = snowLocal, P = snowPos;
  const lv = levels.snow, fall = 0.8 + 0.6 * lv, sway = 0.5 + 1.4 * lv, drift = 7 * lv * lv;   // 雪大起风
  snow.material.size = 0.45 + 0.35 * lv;
  for (let i = 0; i < n; i++) {
    const j = i * 4, k = i * 3, ph = L[j + 3];
    let y = L[j + 1] - (2.6 + (i % 7) * 0.35) * fall * dt;
    if (y < 0) { y += RH; L[j] = rnd(-RW / 2, RW / 2); L[j + 2] = rnd(RZ0, RZ1); }
    L[j + 1] = y;
    L[j] += drift * dt; if (L[j] > RW / 2) L[j] -= RW;
    P[k] = cx + L[j] + Math.sin(time * 0.8 + ph) * sway;
    P[k + 1] = y;
    P[k + 2] = cz + L[j + 2] + Math.cos(time * 0.6 + ph * 1.3) * sway * 0.7;
  }
  snowGeo.setDrawRange(0, n);
  snowGeo.attributes.position.needsUpdate = true;
}

// 虹：挂在反日点方向的远处平面上（随视点平移、不随视角转动，和真虹一样），
// 主虹 40.6°–42.4° 内紫外红，副虹 50°–53° 颜色反转更淡，虹内天光略亮；uK 按“虹大小”整体缩放角半径，
// 同时压低反日点，让弧顶始终停在俯角 22° 附近——虹越大拱越宽，而不是顶出画面
const BOW_DIR = new THREE.Vector3(), BOW_AZ = 0.22, BOW_D = 600;
const bowK = lv => 0.6 + 0.8 * lv;
const bow = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { uO: { value: 0 }, uK: { value: 1 }, uH: { value: 1.5 } },
  vertexShader: `varying vec2 vP;
    void main() { vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uO, uK, uH; varying vec2 vP;
    vec3 spec(float t) {   // t: 0 紫 → 1 红
      vec3 c = clamp(abs(mod((1.0 - t) * 0.78 * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
      return mix(vec3(1.0), c, 0.75);
    }
    void main() {
      vec2 p = vP * uH;
      float r = length(p), a = degrees(atan(r)) / uK;
      float t1 = (a - 40.6) / 1.8, b1 = smoothstep(0.0, 0.2, t1) * (1.0 - smoothstep(0.8, 1.0, t1)) * 0.55;
      float t2 = (a - 50.2) / 3.0, b2 = smoothstep(0.0, 0.25, t2) * (1.0 - smoothstep(0.75, 1.0, t2)) * 0.18;
      float inner = 0.05 * (1.0 - smoothstep(36.0, 40.6, a));
      vec3 col = spec(clamp(t1, 0.0, 1.0)) * b1 + spec(1.0 - clamp(t2, 0.0, 1.0)) * b2 + vec3(inner);
      float al = b1 + b2 + inner;
      float feet = smoothstep(-0.35, 0.5, p.y / max(r, 1e-4));   // 虹脚渐隐
      gl_FragColor = vec4(col / max(al, 1e-4), al * feet * uO);
    }`,
  transparent: true, depthTest: false, depthWrite: false,
}));
bow.renderOrder = 10; bow.frustumCulled = false;
scene.add(rain, snow, bow);

let weather = 'clear';
const fogC = new THREE.Color(), fogC2 = new THREE.Color();
// 当前天气 + 程度 → 目标氛围。氛围按 √程度 插值，小雨小雪也看得出变化
function wxTarget() {
  const c = WEATHER.clear, w = WEATHER[weather], lv = levels[weather] ?? 0;
  const s = weather === 'rainbow' ? 1 : Math.sqrt(lv), tg = {};
  for (const key of ['near', 'far', 'hemi', 'sun', 'wet']) tg[key] = c[key] + (w[key] - c[key]) * s;
  tg.rain = weather === 'rain' ? lv : 0;
  tg.snow = weather === 'snow' ? lv : 0;
  tg.cover = weather === 'snow' ? s : 0;
  tg.bow = weather === 'rainbow' ? 1 : 0;
  tg.bowK = bowK(levels.rainbow);
  tg.fog = fogC.setHex(c.fog).lerp(fogC2.setHex(w.fog), s);
  return tg;
}
const wxBtns = document.querySelectorAll('.wx button[data-w]');
const lvWrap = document.getElementById('lvWrap'), lvName = document.getElementById('lvName'), lvIn = document.getElementById('lv');
function setWeather(w) {
  weather = w;
  wxBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.w === w));
  lvWrap.hidden = !LV_NAME[w];
  if (LV_NAME[w]) { lvName.textContent = LV_NAME[w]; lvIn.value = Math.round(levels[w] * 100); }
}
function setLevel(v) {
  if (!LV_NAME[weather]) return;
  levels[weather] = clamp(v, 0.05, 1); lvIn.value = Math.round(levels[weather] * 100);
}
wxBtns.forEach(b => b.onclick = () => { setWeather(b.dataset.w); b.blur(); });
lvIn.oninput = () => setLevel(lvIn.value / 100);
lvIn.onchange = () => lvIn.blur();
let cur;
const wxFog = new THREE.Color(PAPER);   // 纯天气给的雾色；昼夜在它上面叠
{
  const q = new URLSearchParams(location.search), w = q.get('w'), l = parseFloat(q.get('l'));
  setWeather(WEATHER[w] ? w : 'clear');
  if (l) setLevel(l);
  cur = { ...wxTarget(), fog: undefined };   // 从链接进入时直接到位，不做过渡
  if (WEATHER[w]) wxFog.copy(wxTarget().fog);
}
function updateWeather(dt, time) {
  const tg = wxTarget(), k = 1 - Math.exp(-dt * 0.8);
  for (const key of ['near', 'far', 'hemi', 'sun', 'rain', 'snow', 'bow', 'bowK', 'wet']) cur[key] += (tg[key] - cur[key]) * k;
  cur.cover += (tg.cover - cur.cover) * (1 - Math.exp(-dt * 0.12));   // 积雪慢积慢融
  wxFog.lerp(tg.fog, k);
  scene.fog.near = cur.near; scene.fog.far = cur.far;
  updateDayNight(dt);   // 雾色、天光、日月光都在这里按时辰定
  wxU.uSnow.value = cur.cover; wxU.uWet.value = cur.wet;
  updateRain(dt, cur.rain);
  updateSnow(dt, time, cur.snow);
  bow.visible = cur.bow * (1 - nightK) > 0.003;
  if (bow.visible) {
    const u = bow.material.uniforms, H = Math.tan(Math.min(80, 56 * cur.bowK) * Math.PI / 180);
    u.uO.value = cur.bow * (1 - nightK); u.uK.value = cur.bowK; u.uH.value = H;
    bow.scale.setScalar(BOW_D * H);
    const el = -(22 + 42 * cur.bowK) * Math.PI / 180;
    BOW_DIR.set(Math.sin(BOW_AZ) * Math.cos(el), Math.sin(el), -Math.cos(BOW_AZ) * Math.cos(el));
    bow.position.copy(camera.position).addScaledVector(BOW_DIR, BOW_D);
    bow.lookAt(camera.position);
  }
}

// ---------- 昼夜 ----------
// 时辰每秒走 0.05 个钟头（白天 5–19 点约 4.7 分钟），夜里走一倍快（约 1.7 分钟）。6 点日出、18 点日落
const NIGHT_FOG = new THREE.Color(0x1b2233), DUSK = new THREE.Color(0xe39a66), tmpC = new THREE.Color(), sunOff = new THREE.Vector3(-45, 90, 45);
const SHICHEN = '子丑寅卯辰巳午未申酉戌亥';
let hour = clamp(+(new URLSearchParams(location.search).get('hour') ?? 9), 0, 23.99), nightK = 0, clkTick = 0;
const windowMat = mat(0x8b6b45);   // 各家窗板共用这一个材质：入夜透出灯光
const lanternMat = new THREE.MeshLambertMaterial({ color: 0xc0392b, emissive: 0x401008 });
const lanterns = [], haloMat = new THREE.SpriteMaterial({ transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
{
  const lg = new THREE.CylinderGeometry(0.22, 0.22, 0.42, 8), cg = new THREE.CylinderGeometry(0.15, 0.15, 0.07, 8), cm = new THREE.MeshLambertMaterial({ color: 0x2e241c });
  for (const h of houses) if (h.kind !== 'home') for (const sx of [-1, 1]) {   // 店铺、客栈雨棚外沿挂一对红灯笼
    const g = new THREE.Group(), l = new THREE.Mesh(lg, lanternMat);
    for (const y of [0.24, -0.24]) { const c = new THREE.Mesh(cg, cm); c.position.y = y; g.add(c); }
    g.add(l); g.position.set(h.x + sx * (h.hw - 1.0), 1.55, h.z + h.face * (h.hd + 1.25)); scene.add(g); lanterns.push(g.position);
  }
  for (const h of houses) if (h.kind === 'home') {   // 民居门边挂一盏
    const g = new THREE.Group(), l = new THREE.Mesh(lg, lanternMat);
    for (const y of [0.24, -0.24]) { const c = new THREE.Mesh(cg, cm); c.position.y = y; g.add(c); }
    g.add(l); g.position.set(h.x + 1.0, 2.0, h.z + h.face * (h.hd - 0.05)); scene.add(g); lanterns.push(g.position);
  }
  // 每盏灯笼套一团加色光晕，入夜才显出来
  const halo = fxTex(x => { const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,200,120,.9)'); gr.addColorStop(0.3, 'rgba(255,150,60,.35)'); gr.addColorStop(1, 'rgba(255,120,40,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128); });
  haloMat.map = halo;
  for (const p of lanterns) { const sp = new THREE.Sprite(haloMat); sp.position.copy(p); sp.scale.setScalar(3.2); scene.add(sp); }
}
// 真正照亮街面的点光源只有 12 盏（灯多了着色器吃不消），每半秒挪到离镜头最近的 12 个灯笼下
const lampPool = Array.from({ length: 12 }, () => { const l = new THREE.PointLight(0xffa050, 0, 20, 2); scene.add(l); return l; });
let lampTick = 0;
function updateLamps(dt) {
  if ((lampTick -= dt) <= 0) {
    lampTick = 0.5;
    const c = controls.target, near = lanterns.map(p => [p, (p.x - c.x) ** 2 + (p.z - c.z) ** 2]).sort((a, b) => a[1] - b[1]);
    lampPool.forEach((l, i) => { const p = near[i]?.[0]; if (p) l.position.set(p.x, p.y - 0.3, p.z); });
  }
  const flick = 1 + 0.06 * Math.sin(performance.now() * 0.011);   // 烛火微微跳
  for (const l of lampPool) l.intensity = 45 * nightK * flick;
  haloMat.opacity = nightK;
}
const starSky = (() => {
  const n = 700, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, e = 0.12 + Math.random() * 1.3;
    p.set([Math.cos(e) * Math.cos(a) * 420, Math.sin(e) * 420, Math.cos(e) * Math.sin(a) * 420], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xe8ecff, size: 1.8, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false }));
  m.frustumCulled = false; scene.add(m); return m;
})();
const dayBtn = document.getElementById('dayBtn'), clkEl = document.getElementById('clk');
function updateDayNight(dt) {
  hour = (hour + dt * (hour >= 5 && hour < 19 ? 0.05 : 0.1)) % 24;
  const ang = (hour - 6) / 12 * Math.PI, elev = Math.sin(ang);
  const dayK = THREE.MathUtils.smoothstep(elev, -0.12, 0.22), dusk = Math.max(0, 1 - Math.abs(elev) / 0.3) * (1 - 0.6 * cur.wet);
  nightK = 1 - dayK;
  scene.fog.color.copy(wxFog).lerp(DUSK, dusk * 0.45).lerp(NIGHT_FOG, nightK * 0.88);
  scene.background.copy(scene.fog.color);
  hemi.intensity = cur.hemi * (0.12 + 0.88 * dayK);
  hemi.color.setHex(0xfff4dc).lerp(tmpC.setHex(0x8fa4d8), nightK);
  // 同一盏平行光：白天是太阳从东往西走，入夜换成偏蓝的月光
  const a = nightK > 0.5 ? ang - Math.PI : ang;
  sunOff.set(-Math.cos(a) * 70, 25 + 70 * Math.abs(Math.sin(a)), 45);
  sun.intensity = cur.sun * dayK + 0.32 * nightK * (1 - 0.7 * cur.wet);
  sun.color.setHex(0xfff0d2).lerp(tmpC.setHex(0xffa860), dusk * 0.6).lerp(tmpC.setHex(0x9fb4ff), nightK);
  windowMat.emissive.setHex(0xffa040).multiplyScalar(nightK * 1.1);
  updateLamps(dt);
  lanternMat.emissive.setHex(0xff5a2a).multiplyScalar(0.2 + nightK);
  starSky.material.opacity = nightK * (1 - cur.wet) * (1 - cur.snow);
  starSky.position.copy(camera.position);
  if ((clkTick -= dt) <= 0) {
    clkTick = 0.5;
    const hh = Math.floor(hour), mm = Math.floor((hour % 1) * 60);
    clkEl.textContent = `${SHICHEN[Math.floor(((hour + 1) % 24) / 2)]}時 ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    dayBtn.textContent = nightK > 0.5 ? '夜' : '昼'; dayBtn.setAttribute('aria-pressed', nightK > 0.5);
  }
}
const skipDay = () => { hour = hour >= 5.5 && hour < 18.5 ? 18.5 : 5.5; };   // 跳到下一个黄昏 / 黎明
dayBtn.onclick = () => { skipDay(); dayBtn.blur(); };

// ---------- 天气随机变化 ----------
// 每 1–3 分钟换一次：晴多、雨次之、雪少；雨停后一半概率出虹（只在白天）。手动选天气后这一轮计时重来
const WX_TOAST = { clear: ['云开日出', '天放晴了'], rain: ['下雨了', '街上的人纷纷找地方避雨'], snow: ['下雪了', '汴京城一片素白'], rainbow: ['雨过天晴', '东边挂起一道彩虹'] };
const autoBtn = document.getElementById('autoWx');
let autoWx = new URLSearchParams(location.search).get('auto') !== '0', wxTimer = 60 + Math.random() * 60;
const setAuto = on => { autoWx = on; autoBtn.setAttribute('aria-pressed', on); };
setAuto(autoWx);
autoBtn.onclick = () => { setAuto(!autoWx); autoBtn.blur(); };
function updateAutoWeather(dt) {
  if (!autoWx || (wxTimer -= dt) > 0) return;
  wxTimer = 70 + Math.random() * 110;
  let next;
  if (weather === 'rain' && nightK < 0.5 && Math.random() < 0.5) next = 'rainbow';
  else { const r = Math.random(); next = r < 0.5 ? 'clear' : r < 0.82 ? 'rain' : 'snow'; }
  if (next === weather) next = weather === 'clear' ? 'rain' : 'clear';
  setWeather(next);
  if (LV_NAME[next]) setLevel(0.25 + Math.random() * 0.7);
  if (view !== 'scroll') toast(...WX_TOAST[next]);
}
wxBtns.forEach(b => b.addEventListener('click', () => { wxTimer = 150; }));

// ---------- 长卷控制 ----------
const SECTIONS = [
  [-999, '郊野春寒', '疏林薄霧，驢隊入城'],
  [-105, '汴河漕運', '舟楫相接，縴夫號子'],
  [-28, '虹橋鬧市', '橋上攤販，橋下落桅'],
  [36, '河岸街市', '酒旗招展，腳店臨街'],
  [104, '城門市井', '駝隊出入，正店高樓'],
];
const secEl = document.getElementById('sec'), playBtn = document.getElementById('play'), track = document.getElementById('track');
let playing = true, t = clamp(+new URLSearchParams(location.search).get('t') || 0, 0, 1), curSec = -1;
const SPEED = 1 / 95;   // 95 秒展完一卷
const setBtn = () => { playBtn.textContent = playing ? '⏸ 暂停' : '▶ 展卷'; };
playBtn.onclick = () => { if (!playing && t >= 1) t = 0; playing = !playing; setBtn(); };
track.oninput = () => { t = track.value / 1000; };
addEventListener('keydown', e => {
  if (shopOpen) { if (e.key === 'Escape') closeShop(); return; }   // 商店开着时不响应游戏按键
  if (battle) {
    if (battle.busy) return;
    const n = /^Digit[1-9]$/.test(e.code) ? +e.code.slice(5) - 1 : -1;
    if (battle.view === 'bag') { const it = battleItems()[n]; if (it) heroItem(it.id); if (e.key === 'Escape' || e.code === 'KeyI') menu(); return; }
    if (n >= 0) heroTurn(n);
    if (e.code === 'KeyQ') giveUp();
    if (e.code === 'KeyI') { sfx('pluck', 0.5); bagMenu(); }
    return;
  }
  if (e.key === 'b' || e.key === 'B') { openShop(); return; }
  if (e.key === 'i' || e.key === 'I') { openBag(); return; }
  if (sleeping && (e.code === 'KeyE' || e.code === 'KeyF')) return;   // 睡着时不交互
  if (e.code === 'KeyE' && interactable) { interactable.act(); return; }
  if (e.code === 'KeyF' && talkable) { talkable.act(); return; }
  if (e.key === 'm' || e.key === 'M') setSound(!soundOn);
  if (e.code === 'Space') { e.preventDefault(); if (view === 'scroll') playBtn.click(); }
  if (view === 'scroll' && e.code === 'ArrowRight') t = clamp(t + 0.02, 0, 1);
  if (view === 'scroll' && e.code === 'ArrowLeft') t = clamp(t - 0.02, 0, 1);
  if (e.key === 'v' || e.key === 'V') setView({ scroll: 'third', third: 'first', first: 'scroll' }[view]);
  const w = WX_KEYS[+e.key - 1]; if (w) { setWeather(w); wxTimer = 150; }
  if (e.key === 'n' || e.key === 'N') skipDay();
  if ((e.key === 'g' || e.key === 'G') && view !== 'scroll') toggleArms();
  if (e.key === 'j' || e.key === 'J') streetAttack();
  if (e.key === 'r' || e.key === 'R') setAvoid(!avoid);
  if (e.key === 'c' || e.key === 'C') setCast(cast === 'song' ? 'kenney' : 'song');
  if (e.key === '-') setLevel(levels[weather] - 0.1);
  if (e.key === '=' || e.key === '+') setLevel(levels[weather] + 0.1);
});
function updateSection(x) {
  let k = 0; SECTIONS.forEach(([sx], i) => { if (x >= sx) k = i; });
  if (k === curSec) return;
  curSec = k; secEl.style.opacity = 0;
  setTimeout(() => { secEl.innerHTML = `${SECTIONS[k][1]}<span>${SECTIONS[k][2]}</span>`; secEl.style.opacity = 1; }, 450);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  battleCam.aspect = camera.aspect; battleCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setView(new URLSearchParams(location.search).get('view') ?? 'scroll');
const clock = new THREE.Clock();
let first = true;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  if (battle) { updateBattle(dt); updateAudio(dt); renderer.render(battleScene, battleCam); return; }
  if (view === 'scroll') {
    if (playing) { t = Math.min(1, t + dt * SPEED); if (t >= 1) { playing = false; setBtn(); } }
    const x = X0 + (X1 - X0) * t, dx = x - controls.target.x;
    controls.target.x += dx; camera.position.x += dx;
    controls.update();
  } else {
    updateHero(dt);
    t = clamp((hero.g.position.x - X0) / (X1 - X0), 0, 1);
  }
  track.value = Math.round(t * 1000);
  updateSection(controls.target.x);

  sun.target.position.copy(controls.target);
  sun.position.copy(controls.target).add(sunOff);

  waterTex.offset.x -= dt * 0.03;
  for (const b of boats) {
    if (b.v) { b.u += b.v * dt; if (b.u > 0.72 || b.u < 0.06) { b.v = -b.v; b.u = clamp(b.u, 0.06, 0.72); } placeBoat(b); }
    b.g.position.y = Math.sin(time * 1.3 + b.ph) * 0.08;
    b.g.rotation.x = Math.sin(time * 1.1 + b.ph) * 0.02;
  }
  for (const be of beasts) {
    const P = PATHS[be.path];
    be.s += be.v * dt;
    if (be.s > P.b) be.s = P.a + 20; if (be.s < P.a) be.s = P.b - 5;
    const p = P.f(be.s, be.off);
    be.g.position.copy(p);
    be.g.rotation.y = be.v > 0 ? 0 : Math.PI;
    be.legs.forEach((l, i) => { l.rotation.z = Math.sin(time * 5 + (i % 2) * Math.PI + (i > 1 ? Math.PI / 2 : 0)) * 0.35; });
  }
  updatePeople(dt);
  updateScared(dt);
  updateThief(dt);
  updateOwner(dt);
  if (view === 'first') hero.g.visible = false;   // 第一人称不看见自己
  updateAutoWeather(dt);
  updateWeather(dt, time);
  updateInteract();
  updateAudio(dt);
  updateBuffs(dt);
  updateSleep(dt);
  updateStaminaUI();
  tickSave(dt);
  renderer.render(room ? roomScene : scene, camera);
  if (room) for (const m of roomActors) m.update(dt);
  if (shopOpen) { pvMixer.update(dt); pvR.render(pvScene, pvCam); }
  if (first) { first = false; const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 1000); }
});
</script>
</body>
